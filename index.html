<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlixAI - Pro Movie Recommender</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #0d0d0c;
            color: #ffffff;
            min-height: 100vh;
            background-image: radial-gradient(circle at 50% 0%, #2a0808 0%, #0d0d0c 60%);
            overflow-x: hidden;
        }

        /* Navbar */
        header {
            padding: 25px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 28px;
            font-weight: 700;
            color: #E50914; 
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(229, 9, 20, 0.5);
        }

        /* Hero Section */
        .hero {
            text-align: center;
            padding: 60px 20px 20px;
        }
        .hero h1 {
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 15px;
            background: linear-gradient(90deg, #fff, #aaa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hero p {
            font-size: 1.1rem;
            color: #a3a3a3;
            max-width: 600px;
            margin: 0 auto 30px;
        }

        /* Search Box */
        .search-box {
            display: flex;
            justify-content: center;
            gap: 15px;
            max-width: 700px;
            margin: 0 auto;
        }
        .search-box input {
            width: 70%;
            padding: 18px 25px;
            font-size: 18px;
            border: none;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            outline: none;
            transition: 0.3s;
        }
        .search-box input:focus {
            border-color: #E50914;
            background: rgba(255, 255, 255, 0.15);
        }
        .search-box button {
            padding: 15px 40px;
            font-size: 18px;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            background: #E50914;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(229, 9, 20, 0.4);
        }
        .search-box button:hover {
            background: #f40612;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(229, 9, 20, 0.6);
        }

        /* Sections & Loading */
        .section-title {
            text-align: center;
            font-size: 2rem;
            margin-top: 40px;
            color: #fff;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
        .message-container {
            text-align: center;
            margin-top: 20px;
            font-size: 1.2rem;
            min-height: 30px;
        }
        .loading {
            color: #E50914;
            display: none;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }
        .error-msg { color: #ff4d4d; }

        /* Movie Grid */
        .movies-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 25px;
            padding: 30px 10%;
            max-width: 1400px;
            margin: 0 auto;
        }

        .movie-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 220px;
            cursor: pointer;
        }
        
        .movie-card::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: 0.5s;
        }
        
        .movie-card:hover::before {
            left: 100%;
        }

        .movie-card:hover {
            transform: translateY(-8px);
            border-color: #E50914;
            box-shadow: 0 10px 30px rgba(229, 9, 20, 0.2);
            background: rgba(255, 255, 255, 0.08);
        }

        .movie-icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        .movie-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #fff;
        }

        /* Mobile */
        @media (max-width: 768px) {
            .hero h1 { font-size: 2.2rem; }
            .search-box { flex-direction: column; align-items: center; }
            .search-box input, .search-box button { width: 90%; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">FlixAI</div>
    </header>

    <div class="hero">
        <h1>AI Powered Movies</h1>
        <p>Type your favorite Hollywood movie or click a movie below, and our AI will recommend the best matches for you.</p>
        
        <div class="search-box">
            <input type="text" id="movieInput" placeholder="Eg: Avatar, Batman, Inception..." onkeypress="handleKeyPress(event)">
            <button onclick="fetchRecommendations()">Search</button>
        </div>
    </div>

    <div class="message-container">
        <div id="loadingText" class="loading">⏳ Model is predicting best movies... Please wait...</div>
        <div id="errorText" class="error-msg"></div>
    </div>

    <h2 class="section-title" id="recTitle" style="display: none;">🤖 AI Recommendations</h2>
    <div class="movies-container" id="resultsGrid"></div>

    <h2 class="section-title" id="trendingTitle">🔥 Popular Movies</h2>
    <div class="movies-container" id="trendingGrid"></div>

    <script>
        // 1. Page load hote hi ye movies screen par aa jayengi
        const popularMovies = [
            "Avatar", "The Dark Knight", "Inception", "Interstellar", 
            "Titanic", "The Avengers", "The Matrix", "Spider-Man",
            "Iron Man", "Jurassic Park"
        ];

        window.onload = () => {
            const trendingGrid = document.getElementById("trendingGrid");
            popularMovies.forEach(movie => {
                trendingGrid.innerHTML += `
                    <div class="movie-card" onclick="clickMovieCard('${movie}')">
                        <div class="movie-icon">🔥</div>
                        <div class="movie-title">${movie}</div>
                    </div>
                `;
            });
        };

        // 2. Jab koi movie card par click kare
        function clickMovieCard(movieName) {
            // Search box me naam bhar do
            document.getElementById("movieInput").value = movieName;
            
            // Screen ko smoothly upar search box ki taraf le jao
            window.scrollTo({ top: 0, behavior: 'smooth' });
            
            // API ko request bhej do
            fetchRecommendations();
        }

        // Enter dabane par bhi search
        function handleKeyPress(event) {
            if (event.key === "Enter") {
                fetchRecommendations();
            }
        }

        // 3. Asli AI Recommendation Function
        async function fetchRecommendations() {
            const movieInput = document.getElementById("movieInput").value.trim();
            const resultsGrid = document.getElementById("resultsGrid");
            const loadingText = document.getElementById("loadingText");
            const errorText = document.getElementById("errorText");
            const recTitle = document.getElementById("recTitle");

            if (!movieInput) {
                errorText.innerHTML = "⚠️ Please enter a movie name first!";
                resultsGrid.innerHTML = "";
                recTitle.style.display = "none";
                return;
            }

            // UI Reset
            errorText.innerHTML = "";
            resultsGrid.innerHTML = "";
            recTitle.style.display = "none";
            loadingText.style.display = "block";

            try {
                // TUMHARA API LINK
                const apiUrl = `https://movie-recommender-api-xu5m.onrender.com/recommend?movie=${encodeURIComponent(movieInput)}`;
                
                const response = await fetch(apiUrl);
                const data = await response.json();

                loadingText.style.display = "none";

                if (data.error) {
                    errorText.innerHTML = data.error;
                } 
                else if (data.recommendations && data.recommendations.length > 0) {
                    // Agar movies mil gayi toh Title dikhao
                    recTitle.style.display = "block";
                    recTitle.innerHTML = `🤖 Because you liked "${data.searched_movie}"`;

                    // Movies display karo (ye naye cards honge, jinpe click karne se firse search hoga)
                    data.recommendations.forEach((movieName) => {
                        resultsGrid.innerHTML += `
                            <div class="movie-card" onclick="clickMovieCard('${movieName}')">
                                <div class="movie-icon">🎬</div>
                                <div class="movie-title">${movieName}</div>
                            </div>
                        `;
                    });
                }

            } catch (error) {
                loadingText.style.display = "none";
                errorText.innerHTML = "🚨 Backend se connect nahi ho paaya! Server so raha hoga, thodi der baad try karo.";
            }
        }
    </script>
</body>
</html>
