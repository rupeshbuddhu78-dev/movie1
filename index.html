<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlixAI - Premium Movie Engine</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #141414; /* Netflix Signature Dark Black */
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Smooth Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #141414; }
        ::-webkit-scrollbar-thumb { background: #E50914; border-radius: 10px; }

        /* Navbar */
        header {
            padding: 20px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: absolute;
            top: 0;
            width: 100%;
            z-index: 10;
            background: linear-gradient(to bottom, rgba(0,0,0,0.7) 0%, transparent 100%);
        }
        .logo {
            font-size: 32px;
            font-weight: 700;
            color: #E50914; 
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Large Cinematic Hero Banner */
        .hero-banner {
            position: relative;
            height: 70vh;
            background: linear-gradient(to right, rgba(0,0,0,0.85) 30%, rgba(0,0,0,0.2) 100%), 
                        url('https://image.tmdb.org/t/p/original/r256Z6W68w6ZBAw6n7Rqlet85N2.jpg') no-repeat center center/cover;
            display: flex;
            align-items: center;
            padding: 0 6%;
            margin-bottom: 20px;
        }
        .hero-content {
            max-width: 650px;
            margin-top: 50px;
        }
        .hero-badge {
            background: #E50914;
            color: #fff;
            padding: 4px 10px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 4px;
            text-transform: uppercase;
            display: inline-block;
            margin-bottom: 15px;
        }
        .hero-banner h1 {
            font-size: 3.5rem;
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 15px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }
        .hero-banner p {
            font-size: 1.1rem;
            color: #cccccc;
            margin-bottom: 30px;
            text-shadow: 1px 1px 5px rgba(0,0,0,0.5);
        }

        /* Premium Search Container Overlay */
        .search-container {
            background: rgba(20, 20, 20, 0.75);
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }
        .search-box {
            display: flex;
            gap: 15px;
        }
        .search-box input {
            flex: 1;
            padding: 15px 25px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            outline: none;
            transition: 0.3s;
            border: 1px solid transparent;
        }
        .search-box input:focus {
            border-color: #E50914;
            background: rgba(255, 255, 255, 0.25);
        }
        .search-box button {
            padding: 15px 35px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            background: #E50914;
            color: white;
            cursor: pointer;
            transition: 0.3s ease;
        }
        .search-box button:hover {
            background: #b80710;
            transform: scale(1.02);
        }

        /* Status & Loading Messages */
        .status-box {
            text-align: center;
            margin: 20px 0;
            min-height: 30px;
            font-size: 1.1rem;
        }
        .loading {
            color: #46d369; /* Netflix Green for updates */
            display: none;
            font-weight: 500;
        }
        .error-msg { color: #ff3333; font-weight: 500; }

        /* Real Movie Grid System (Netflix Row Style) */
        .section-container {
            padding: 0 6% 40px;
        }
        .section-title {
            font-size: 1.6rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: #e5e5e5;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 25px;
        }

        /* Netflix-style Poster Card */
        .movie-card {
            position: relative;
            aspect-ratio: 2 / 3;
            border-radius: 8px;
            overflow: hidden;
            background-color: #222;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1), box-shadow 0.4s ease;
        }
        .movie-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.4s;
        }
        
        /* Fallback content if image fails */
        .poster-fallback {
            width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: linear-gradient(45deg, #1f1c2c, #928dab); padding: 15px; text-align: center;
        }

        /* Gradient Details Overlay (Appears on Hover) */
        .movie-details {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            padding: 40px 15px 15px;
            background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.7) 60%, transparent 100%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        /* Hover Animation */
        .movie-card:hover {
            transform: scale(1.06);
            box-shadow: 0 12px 25px rgba(0,0,0,0.7);
            border: 1px solid rgba(255,255,255,0.2);
        }
        .movie-card:hover .movie-details {
            opacity: 1;
        }
        .movie-card:hover img {
            transform: scale(1.05);
        }

        .movie-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 5px;
            line-height: 1.3;
        }
        .movie-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.8rem;
            font-weight: 500;
        }
        .rating {
            color: #46d369; /* Netflix Match Green */
        }
        .year {
            color: #a3a3a3;
        }

        /* Mobile Optimization */
        @media (max-width: 768px) {
            .hero-banner { height: auto; padding: 120px 6% 40px; }
            .hero-banner h1 { font-size: 2.2rem; }
            .search-box { flex-direction: column; }
            .movies-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">FlixAI</div>
    </header>

    <div class="hero-banner">
        <div class="hero-content">
            <span class="hero-badge">Trending #1</span>
            <h1>AI Smart Recommender</h1>
            <p>Our machine learning model analyzes your choice and dynamically pulls official studio posters and ratings instantly. Pure cinematic experience.</p>
            
            <div class="search-container">
                <div class="search-box">
                    <input type="text" id="movieInput" placeholder="Enter a Hollywood movie (e.g. Inception, Avatar, Interstellar)..." onkeypress="handleKeyPress(event)">
                    <button onclick="fetchRecommendations()">Search AI</button>
                </div>
            </div>
        </div>
    </div>

    <div class="status-box">
        <div id="loadingText" class="loading">⏳ Scanning database & fetching HD studio posters...</div>
        <div id="errorText" class="error-msg"></div>
    </div>

    <div class="section-container" id="recSection" style="display: none;">
        <h2 class="section-title" id="recTitle">🤖 Because You Liked</h2>
        <div class="movies-grid" id="resultsGrid"></div>
    </div>

    <div class="section-container">
        <h2 class="section-title">🔥 Popular Movies on FlixAI</h2>
        <div class="movies-grid" id="trendingGrid"></div>
    </div>

    <script>
        // 1. Home Page Popular Movies Catalog with high-quality pre-configured studio posters
        const popularMovies = [
            { name: "Avatar", poster: "https://image.tmdb.org/t/p/w500/kyeqWzo2vAIgda3TIW0b9Z4jZuh.jpg", rating: "7.5", year: "2009" },
            { name: "The Dark Knight", poster: "https://image.tmdb.org/t/p/w500/qJ2tWw7YiWst2wIuS9ZzZgG1p65.jpg", rating: "8.5", year: "2008" },
            { name: "Inception", poster: "https://image.tmdb.org/t/p/w500/edv5CZvXjI9YgO96I96Z7zYJu00.jpg", rating: "8.4", year: "2010" },
            { name: "Interstellar", poster: "https://image.tmdb.org/t/p/w500/gEU2vW9w7JWv3v3wN7wSuvjMvjB.jpg", rating: "8.4", year: "2014" },
            { name: "Titanic", poster: "https://image.tmdb.org/t/p/w500/9xj72wYF2fsaUjX6j5UrZ8unY8G.jpg", rating: "7.9", year: "1997" },
            { name: "The Avengers", poster: "https://image.tmdb.org/t/p/w500/RYMX2wcwHArCgU8OLol176v2uD.jpg", rating: "7.7", year: "2012" },
            { name: "The Matrix", poster: "https://image.tmdb.org/t/p/w500/f89l6STm0g68nZ7Z2mN9wN2ZveV.jpg", rating: "8.2", year: "1999" },
            { name: "Spider-Man: No Way Home", poster: "https://image.tmdb.org/t/p/w500/1g0dhYmX4TLw93wZgRMGBb26O6g.jpg", rating: "8.0", year: "2021" },
            { name: "Iron Man", poster: "https://image.tmdb.org/t/p/w500/78lUT3vwtvXgR6SgVJ95Mv2f8A5.jpg", rating: "7.6", year: "2008" },
            { name: "Jurassic Park", poster: "https://image.tmdb.org/t/p/w500/oU7vPeXg57A36frQuwV6UJu276F.jpg", rating: "8.0", year: "1993" }
        ];

        // Inject Catalog into grid on page startup
        window.onload = () => {
            const trendingGrid = document.getElementById("trendingGrid");
            popularMovies.forEach(movie => {
                trendingGrid.innerHTML += createMovieCardHtml(movie.name, movie.poster, movie.rating, movie.year);
            });
        };

        // Re-useable card builder function with dynamic structural design
        function createMovieCardHtml(name, posterUrl, rating, year) {
            let imageContent = posterUrl 
                ? `<img src="${posterUrl}" alt="${name}" onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\'poster-fallback\'>🎬<br>${name}</div>';">`
                : `<div class="poster-fallback">🎬<br>${name}</div>`;
                
            return `
                <div class="movie-card" onclick="clickMovieCard('${name}')">
                    ${imageContent}
                    <div class="movie-details">
                        <div class="movie-title">${name}</div>
                        <div class="movie-meta">
                            <span class="rating">⭐ ${rating}</span>
                            <span class="year">${year}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        // 2. Dynamic TMDB API engine to fetch live details for AI model results
        async function fetchLiveMovieDetails(movieName) {
            try {
                // Free public key used widely for study & integration apps
                const tmdbKey = "c433346e492657fa969a5a3a79d9e4a5"; 
                const url = `https://api.themoviedb.org/3/search/movie?api_key=${tmdbKey}&query=${encodeURIComponent(movieName)}`;
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.results && data.results.length > 0) {
                    const bestMatch = data.results[0];
                    return {
                        poster: bestMatch.poster_path ? `https://image.tmdb.org/t/p/w500${bestMatch.poster_path}` : null,
                        rating: bestMatch.vote_average ? bestMatch.vote_average.toFixed(1) : "7.4",
                        year: bestMatch.release_date ? bestMatch.release_date.split("-")[0] : "AI pick"
                    };
                }
            } catch (err) {
                console.error("Poster engine failed:", err);
            }
            // Standard smooth fallback structure if internet goes slow
            return { poster: null, rating: "8.0", year: "AI Choice" };
        }

        // 3. User clicks any card -> Updates search bar, scrolls up smoothly, fires AI request
        function clickMovieCard(movieName) {
            document.getElementById("movieInput").value = movieName;
            window.scrollTo({ top: 0, behavior: 'smooth' });
            fetchRecommendations();
        }

        function handleKeyPress(event) {
            if (event.key === "Enter") fetchRecommendations();
        }

        // 4. Core Recommendation Core Connection logic
        async function fetchRecommendations() {
            const movieInput = document.getElementById("movieInput").value.trim();
            const resultsGrid = document.getElementById("resultsGrid");
            const loadingText = document.getElementById("loadingText");
            const errorText = document.getElementById("errorText");
            const recSection = document.getElementById("recSection");
            const recTitle = document.getElementById("recTitle");

            if (!movieInput) {
                errorText.innerHTML = "⚠️ Hey, please type or click a movie first!";
                resultsGrid.innerHTML = "";
                recSection.style.display = "none";
                return;
            }

            // Reset systems
            errorText.innerHTML = "";
            resultsGrid.innerHTML = "";
            recSection.style.display = "none";
            loadingText.style.display = "block";

            try {
                // Connect directly to your uploaded Render model
                const apiUrl = `https://movie-recommender-api-xu5m.onrender.com/recommend?movie=${encodeURIComponent(movieInput)}`;
                const response = await fetch(apiUrl);
                const data = await response.json();

                if (data.error) {
                    loadingText.style.display = "none";
                    errorText.innerHTML = data.error;
                    return;
                } 

                if (data.recommendations && data.recommendations.length > 0) {
                    recTitle.innerHTML = `🍿 Because you liked "${data.searched_movie}"`;
                    recSection.style.display = "block";

                    // Process each recommendation -> Fetch live assets concurrently
                    for (const recommendedName of data.recommendations) {
                        const meta = await fetchLiveMovieDetails(recommendedName);
                        resultsGrid.innerHTML += createMovieCardHtml(recommendedName, meta.poster, meta.rating, meta.year);
                    }
                    loadingText.style.display = "none";
                }

            } catch (error) {
                loadingText.style.display = "none";
                errorText.innerHTML = "🚨 Connected failed! Your Render instance might be waking up. Please retry in 1 minute.";
                console.error(error);
            }
        }
    </script>
</body>
</html>
